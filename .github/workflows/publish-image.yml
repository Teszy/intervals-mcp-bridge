name: Container publish
run-name: 'chore(release): publish container ${{ github.event.release.tag_name }}'

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-runtime-image
  cancel-in-progress: false

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - name: Validate release and prepare image names
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$image:$version-$IMAGE_ARCH" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Source quality gates already ran in CI & Release before Release Please
      # published this release. Here we test the exact runtime image being pushed.
      - name: Install smoke test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: |
            intervals-mcp-bridge:ci-smoke
            ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.licenses=MIT

      - name: Smoke test compiled application in runtime image
        run: pnpm test:container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested platform image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE_TAG"

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and latest tags from tested images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          tags=(--tag "$image:$version")
          # Retrying an older release must not move latest backwards.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$RELEASE_TAG" ]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:$version-amd64" "$image:$version-arm64"
