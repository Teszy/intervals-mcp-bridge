name: CI & Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Validate main
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: pnpm check

      - name: Build runtime image
        run: docker build --tag intervals-mcp-bridge:ci-smoke .

      - name: Smoke test compiled application in runtime image
        run: pnpm test:container

  release:
    name: Release
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      # A separate token lets release PRs trigger the required PR workflow.
      - name: Verify release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Add RELEASE_PLEASE_TOKEN with Contents, Pull requests, and Issues write permissions for this repository."
            exit 1
          fi

      - name: Prepare release PR or publish merged release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
