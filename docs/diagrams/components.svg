<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="730" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172338">
    <text x="30" y="45" font-size="24" font-weight="bold">Architecture overview &#x2014; current local implementation</text>
    <text x="30" y="85" font-size="14">Blue: our application &#xB7; Purple: third-party libraries &#xB7; Green: external hosts/services</text>
    <rect x="330" y="140" width="450" height="530" rx="10" fill="#fafbfc" stroke="#aeb8c4" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="555" y="168" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold">MCP bridge &#x2014; one Node.js process</text>
    <rect x="30" y="200" width="240" height="80" rx="10" fill="#e5f4ef" stroke="#40836e" stroke-width="1.5"/>
    <text x="150" y="228" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold">MCP host</text>
    <text x="150" y="252" text-anchor="middle" dominant-baseline="middle" font-size="15">VS Code + Copilot</text>
    <rect x="30" y="450" width="240" height="80" rx="10" fill="#e5f4ef" stroke="#40836e" stroke-width="1.5"/>
    <text x="150" y="478" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold">LLM / model provider</text>
    <text x="150" y="502" text-anchor="middle" dominant-baseline="middle" font-size="15">Managed by the host</text>
    <rect x="360" y="200" width="390" height="80" rx="10" fill="#f2edff" stroke="#78639d" stroke-width="1.5"/>
    <text x="555" y="228" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold">MCP SDK</text>
    <text x="555" y="252" text-anchor="middle" dominant-baseline="middle" font-size="15">Local stdio transport and tool dispatch</text>
    <rect x="360" y="360" width="390" height="110" rx="10" fill="#eaf2ff" stroke="#4169a1" stroke-width="1.5"/>
    <text x="555" y="391" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold">Bridge application</text>
    <text x="555" y="415" text-anchor="middle" dominant-baseline="middle" font-size="15">Curated data and stream analysis</text>
    <text x="555" y="439" text-anchor="middle" dominant-baseline="middle" font-size="15">Reviewed workout publication</text>
    <rect x="360" y="550" width="390" height="80" rx="10" fill="#f2edff" stroke="#78639d" stroke-width="1.5"/>
    <text x="555" y="578" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold">Supporting libraries</text>
    <text x="555" y="602" text-anchor="middle" dominant-baseline="middle" font-size="15">Zod &#xB7; Axios &#xB7; Garmin FIT SDK</text>
    <rect x="850" y="360" width="220" height="110" rx="10" fill="#e5f4ef" stroke="#40836e" stroke-width="1.5"/>
    <text x="960" y="391" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold">Intervals.icu API</text>
    <text x="960" y="415" text-anchor="middle" dominant-baseline="middle" font-size="15">Athlete data</text>
    <text x="960" y="439" text-anchor="middle" dominant-baseline="middle" font-size="15">Calendar workouts</text>
    <path d="M 270 240 L 360 240" fill="none" stroke="#64748b" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="315" y="210" text-anchor="middle" font-size="13" paint-order="stroke" stroke="white" stroke-width="5">MCP over</text>
    <text x="315" y="227" text-anchor="middle" font-size="13" paint-order="stroke" stroke="white" stroke-width="5">stdio</text>
    <path d="M 150 280 L 150 450" fill="none" stroke="#64748b" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="150" y="355" text-anchor="middle" font-size="13" paint-order="stroke" stroke="white" stroke-width="5">Model requests / tool results</text>
    <path d="M 555 280 L 555 360" fill="none" stroke="#64748b" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="555" y="310" text-anchor="middle" font-size="13" paint-order="stroke" stroke="white" stroke-width="5">Invoke tools / return results</text>
    <path d="M 555 470 L 555 550" fill="none" stroke="#64748b" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="555" y="500" text-anchor="middle" font-size="13" paint-order="stroke" stroke="white" stroke-width="5">In-process library calls</text>
    <path d="M 750 415 L 850 415" fill="none" stroke="#64748b" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="800" y="385" text-anchor="middle" font-size="13" paint-order="stroke" stroke="white" stroke-width="5">HTTPS +</text>
    <text x="800" y="402" text-anchor="middle" font-size="13" paint-order="stroke" stroke="white" stroke-width="5">API key</text>
  </g>
</svg>
