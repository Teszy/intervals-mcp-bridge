config_version: 1
control_plane:
  base_url: https://api.openai.com
  # Compose maps OPENAI_TUNNEL_ID to the client-native CONTROL_PLANE_TUNNEL_ID.
  api_key: env:CONTROL_PLANE_API_KEY
health:
  listen_addr: 127.0.0.1:8080
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      command: node --env-file=/run/secrets/intervals_env /app/dist/src/index.js
